# https://taskfile.dev

version: "3"

dotenv: [".env"]

vars:
  GREETING: Hello, World!
  DOCKER_BIN: nerdctl
  DOCKER_HOST: docker.io
  SMC_NAMESPACE: smcprober
  VERSION: latest
# version should come from centralized place as builds are done by Tekton workflows
#   sh: "./scripts/generate-version.sh"

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true
  "test:alerts":
    desc: Run Prometheus alert rule tests
    cmds:
      - mise exec -- promtool test rules tests/alerts/test_*.yaml

  "generate:device:dashboard":
    cmds:
      - echo "Generating SmartCitizen Device Dashboard..."
      - |
        go run cmd/gen-device-dashboard/main.go \
          --config configs/device-dashboard.json \
          > helm/dashboards/device-details.json
  "generate:dashboards":
    cmds:
      - task: generate:device:dashboard

  "release:helm":
    cmds:
      - task: generate:dashboards
      - helm package helm --app-version "{{.VERSION}}"
      - helm push smcprober-*.tgz oci://registry-1.docker.io/tauho
      - rm smcprober-*.tgz
    vars:
      VERSION:
        sh: "cat VERSION"

  "run:exporter":
    cmds:
      - "echo Starting SmartCitizen Exporter..."
      - |
        go run cmd/smcexporter/main.go \
          --config configs/config-exporter-dev.json \
          --dotenv .env

  "run:job":
    cmds:
      - echo "Trigger ProbeJob"
      - go run cmd/smcjob/main.go --config configs/config.json --dotenv .env

  "run:downloader":
    cmds:
      - echo "Fetching data from SmartCitizen API..."
      - go run cmd/smcdownload/main.go --config configs/config.json --dotenv .env

  "run:weather":
    desc: Run weather exporter locally (port 8081)
    cmds:
      - go run cmd/smcweather/main.go --config configs/config-weather-dev.json --dotenv .env

  "smoke:weather":
    desc: Smoke test a running weather exporter (run task run:weather first)
    cmds:
      - curl -sf http://localhost:8081/healthz
      - curl -sf http://localhost:8081/readyz
      - curl -sf http://localhost:8081/metrics | grep -c weather_temperature
      - curl -sf http://localhost:8081/metrics | grep -c weather_uv_index
      - curl -sf http://localhost:8081/metrics | grep -c weather_location_info

  "lint:go":
    desc: Run golangci-lint to check code quality
    env:
      CGO_ENABLED: "0"
    cmds:
      - golangci-lint run ./...

  "lint:go:fix":
    desc: Run golangci-lint and automatically fix issues
    env:
      CGO_ENABLED: "0"
    cmds:
      - golangci-lint run --fix ./...

  "lint:helm":
    desc: Lint Helm charts
    cmds:
      - helm lint ./helm

  "lint:markdown":
    desc: Lint markdown files
    cmds:
      - markdownlint-cli2 README.md docs/*.md

  "lint:all":
    desc: Run all linters
    cmds:
      - task: lint:go
      - task: lint:helm
      - task: lint:markdown

  "template:helm":
    desc: Render Helm templates for inspection (dry-run only, does not deploy)
    cmds:
      - task: generate:dashboards
      - |
        helm template dev ./helm --debug \
          --namespace {{.SMC_NAMESPACE}} \
          --set "image.tag"="{{.VERSION}}" \
          --set-file=configJSON=configs/config-k8s.json \
          --set-file=configExporterJSON=configs/config-exporter-k8s.json \
          --set-file=secret.env=.env \
          --set serviceMonitor.enabled=true \
          --set alertmanager.enabled=true \
          --set alertmanager.webhooks.default="{{.NTFY_DEFAULT_WEBHOOK_URL}}" \
          --set alertmanager.webhooks.critical="{{.NTFY_CRITICAL_WEBHOOK_URL}}" \
          {{.CLI_ARGS}} \
          > smcprober.yaml
      - kubectl apply -f smcprober.yaml --dry-run=server

  "deploy:helm":
    desc: Deploy or upgrade the smcprober release via Helm (tracked, atomic)
    cmds:
      - task: generate:dashboards
      - |
        helm upgrade --install dev ./helm \
          --namespace {{.SMC_NAMESPACE}} \
          --create-namespace \
          --rollback-on-failure \
          --set "image.tag"="{{.VERSION}}" \
          --set-file=configJSON=configs/config-k8s.json \
          --set-file=configExporterJSON=configs/config-exporter-k8s.json \
          --set-file=secret.env=.env \
          --set serviceMonitor.enabled=true \
          --set alertmanager.enabled=true \
          --set alertmanager.webhooks.default="{{.NTFY_DEFAULT_WEBHOOK_URL}}" \
          --set alertmanager.webhooks.critical="{{.NTFY_CRITICAL_WEBHOOK_URL}}" \
          {{.CLI_ARGS}}

  "build:docker":
    cmds:
      - |
        {{.DOCKER_BIN}} build \
          -t smcprober:{{.VERSION}} \
          -f Dockerfile \
          .

  "run:docker":
    cmds:
      - "mkdir -p configs secrets"
      - |
        {{.DOCKER_BIN}} run --rm \
          --volume {{.PWD}}/configs:/app/configs:ro \
          --volume {{.PWD}}/secrets:/app/secrets:ro \
          -p 8080:8080 \
          smcprober:{{.VERSION}} \
          /app/smcexporter --config /app/configs/config-k8s.json --dotenv /app/secrets/.env
    deps:
      - build:docker

  "release:docker":
    cmds:
      - task: "build:docker"
      - "{{.DOCKER_BIN}} tag smcprober:{{.VERSION}} {{.DOCKER_HOST}}/tauho/smcprober:{{.VERSION}}"
      - "{{.DOCKER_BIN}} push {{.DOCKER_HOST}}/tauho/smcprober:{{.VERSION}}"

  release:
    desc: "Deprecated: replaced by pipeline"
    cmds:
      - task: release:docker
      - task: release:helm

  "deploy:namespace":
    cmds:
      - kubectl create namespace {{.SMC_NAMESPACE}} --dry-run=server -o yaml | kubectl apply -f -

  "deploy:credentials":
    cmds:
      - echo "Creating Docker registry secret in namespace {{.SMC_NAMESPACE}}"
      - |
        kubectl create secret docker-registry smcprober-registry -n {{.SMC_NAMESPACE}} \
          --docker-username={{.DOCKER_USERNAME}} \
          --docker-password={{.DOCKER_PASSWORD}} \
          --docker-server={{.DOCKER_HOST}}
    requires:
      vars: [DOCKER_USERNAME, DOCKER_PASSWORD, DOCKER_HOST]
  "deploy:ci:credentials":
    desc: Create/update docker-config secret in smc-cicd namespace for Tekton pipeline
    cmds:
      - echo "Creating Docker registry secret for CI pipeline in namespace smc-cicd"
      - |
        kubectl create secret docker-registry docker-config -n smc-cicd \
          --docker-username={{.DOCKER_USERNAME}} \
          --docker-password={{.DOCKER_PASSWORD}} \
          --docker-server=registry-1.docker.io \
          --dry-run=client -o yaml | kubectl apply -f -
    requires:
      vars: [DOCKER_USERNAME, DOCKER_PASSWORD]
  "deploy:triggers":
    desc: Deploy Tekton Triggers resources for GitHub webhook (EventListener + Tailscale Funnel)
    cmds:
      - kubectl apply -f helm/triggers/
  "deploy:webhook:secret":
    desc: Create/update GitHub webhook HMAC secret for Tekton EventListener
    cmds:
      - |
        kubectl create secret generic github-webhook-secret \
          --from-literal=secretToken={{.GITHUB_WEBHOOK_SECRET}} \
          -n smc-cicd \
          --dry-run=client -o yaml | kubectl apply -f -
    requires:
      vars: [GITHUB_WEBHOOK_SECRET]
  "get:webhook:url":
    desc: Print the public Funnel URL to configure in GitHub webhook settings
    cmds:
      - |
        kubectl get ingress tekton-webhook-funnel -n smc-cicd \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{"\n"}'
  "smoke:cicd:webhook":
    desc: Send a signed test push event through Tailscale Funnel to verify the webhook path end-to-end
    cmds:
      - |
        SECRET=$(kubectl get secret github-webhook-secret -n smc-cicd \
          -o jsonpath='{.data.secretToken}' | base64 -d)
        URL=https://$(kubectl get ingress tekton-webhook-funnel -n smc-cicd \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        BODY='{"ref":"refs/heads/main","repository":{"full_name":"{{.GITHUB_REPO}}"}}'
        SIG=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print "sha256="$2}')
        echo "Sending test push event to $URL"
        curl -sf -X POST \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -H "X-GitHub-Delivery: smoke-test-$(date +%s)" \
          -H "X-Hub-Signature-256: $SIG" \
          -d "$BODY" \
          "$URL"
        echo ""
        echo "Done - check pipeline runs with: kubectl get pipelinerun -n smc-cicd"
    vars:
      GITHUB_REPO: timgluz/smcprober
  "expose:prometheus":
    cmds:
      - "kubectl port-forward -n monitoring svc/prometheus-operated 9090:9090"
  "expose:grafana":
    cmds:
      - "kubectl port-forward -n monitoring svc/prometheus-grafana 3000:80"
  "expose:service":
    cmds:
      - "kubectl port-forward -n {{.SMC_NAMESPACE}} svc/dev-smcprober 8080:80"
  "expose:tekton":
    cmds:
      - "kubectl port-forward -n tekton-pipelines service/tekton-dashboard 9097:9097"
