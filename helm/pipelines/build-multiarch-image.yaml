apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-multiarch-image
  namespace: smc-cicd
spec:
  params:
    - name: repo
      type: string
      default: timgluz/smcprober
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      default: docker.io/tauho/smcprober:latest
    - name: registry
      type: string
      description: Registry host whose credentials are verified; must match the image registry.
      default: docker.io
    - name: registry-insecure
      type: string
      description: Set to "true" for plain-HTTP registries (disables TLS verification).
      default: "false"
  workspaces:
    - name: dockerconfig
  tasks:
    - name: verify-creds
      taskRef:
        name: verify-dockerhub-creds
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: registry
          value: $(params.registry)
        - name: registry-insecure
          value: $(params.registry-insecure)
    - name: build-amd64
      retries: 3
      runAfter:
        - verify-creds
      taskRef:
        name: git-clone-and-build
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: repo
          value: $(params.repo)
        - name: revision
          value: $(params.revision)
        - name: image
          value: $(params.image)
        - name: platform
          value: linux/amd64
        - name: registry-insecure
          value: $(params.registry-insecure)
    - name: build-arm64
      retries: 3
      runAfter:
        - verify-creds
      taskRef:
        name: git-clone-and-build
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: repo
          value: $(params.repo)
        - name: revision
          value: $(params.revision)
        - name: image
          value: $(params.image)
        - name: platform
          value: linux/arm64
        - name: registry-insecure
          value: $(params.registry-insecure)
    - name: create-manifest
      runAfter:
        - build-amd64
        - build-arm64
      taskRef:
        name: create-docker-manifest
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: image
          value: $(params.image)
        - name: images
          value:
            - $(params.image)-amd64
            - $(params.image)-arm64
        - name: registry-insecure
          value: $(params.registry-insecure)
