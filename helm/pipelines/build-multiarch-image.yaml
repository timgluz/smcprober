apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-multiarch-image
  namespace: smc-cicd
spec:
  params:
    - name: repo
      type: string
      default: timgluz/smcprober
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      description: Image repository without a tag; the resolved version is appended.
      default: docker.io/tauho/smcprober
    - name: release-tag
      type: string
      description: >-
        Git tag being released (e.g. v0.0.3). It must match the VERSION file, and
        the image is published under that immutable tag. Leave empty for
        non-release builds, which publish the moving "latest" tag.
      default: ""
    - name: additional-tag
      type: string
      description: Extra moving tag applied to the manifest (e.g. latest). Empty disables it.
      default: ""
    - name: oci-registry
      type: string
      description: OCI registry URL used to publish the Helm chart on tagged releases.
      default: oci://registry-1.docker.io/tauho
    - name: registry
      type: string
      description: Registry host whose credentials are verified; must match the image registry.
      default: docker.io
    - name: registry-insecure
      type: string
      description: Set to "true" for plain-HTTP registries (disables TLS verification).
      default: "false"
  workspaces:
    - name: dockerconfig
  tasks:
    - name: verify-creds
      taskRef:
        name: verify-dockerhub-creds
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: registry
          value: $(params.registry)
        - name: registry-insecure
          value: $(params.registry-insecure)
    - name: resolve-version
      taskRef:
        name: resolve-version
      params:
        - name: repo
          value: $(params.repo)
        - name: release-tag
          value: $(params.release-tag)
    - name: build-amd64
      retries: 3
      runAfter:
        - verify-creds
        - resolve-version
      taskRef:
        name: git-clone-and-build
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: repo
          value: $(params.repo)
        - name: revision
          value: $(params.revision)
        - name: image
          value: $(params.image)
        - name: version
          value: $(tasks.resolve-version.results.version)
        - name: platform
          value: linux/amd64
        - name: registry-insecure
          value: $(params.registry-insecure)
    - name: build-arm64
      retries: 3
      runAfter:
        - verify-creds
        - resolve-version
      taskRef:
        name: git-clone-and-build
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: repo
          value: $(params.repo)
        - name: revision
          value: $(params.revision)
        - name: image
          value: $(params.image)
        - name: version
          value: $(tasks.resolve-version.results.version)
        - name: platform
          value: linux/arm64
        - name: registry-insecure
          value: $(params.registry-insecure)
    - name: create-manifest
      runAfter:
        - build-amd64
        - build-arm64
      taskRef:
        name: create-docker-manifest
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: image
          value: $(params.image)
        - name: version
          value: $(tasks.resolve-version.results.version)
        - name: additional-tag
          value: $(params.additional-tag)
        - name: images
          value:
            - $(tasks.build-amd64.results.image)
            - $(tasks.build-arm64.results.image)
        - name: registry-insecure
          value: $(params.registry-insecure)
    # Tagged releases also publish the Helm chart at the same version.
    - name: release-helm
      runAfter:
        - create-manifest
      when:
        - input: $(params.release-tag)
          operator: notin
          values: [""]
      taskRef:
        name: package-helm
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: repo
          value: $(params.repo)
        - name: revision
          value: $(params.revision)
        - name: version
          value: $(tasks.resolve-version.results.version)
        - name: oci-registry
          value: $(params.oci-registry)
        - name: registry-insecure
          value: $(params.registry-insecure)
