apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-multiarch-image-
  namespace: smc-cicd
spec:
  pipelineRef:
    name: build-multiarch-image
  params:
    - name: repo
      value: timgluz/smcprober
    - name: revision
      value: main
    # Repository without a tag; the pipeline resolves the version.
    - name: image
      value: docker.io/tauho/smcprober
    # Set to a git tag (and matching VERSION) to publish an immutable release,
    # e.g. release-tag: v0.0.3, revision: v0.0.3, additional-tag: latest.
    - name: release-tag
      value: ""
    # For a release build set this to "latest" to also move the moving tag.
    - name: additional-tag
      value: ""
    - name: registry
      value: docker.io
    - name: registry-insecure
      value: "false"
  workspaces:
    - name: dockerconfig
      secret:
        secretName: docker-config
  taskRunSpecs:
    - pipelineTaskName: build-amd64
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: amd64
    - pipelineTaskName: build-arm64
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: arm64
