apiVersion: v2
name: smcprober
description: A Helm chart for deploying smcprober application

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. It tracks the VERSION file in the repository root,
# minus the leading "v" (Helm requires a SemVerV2 version, e.g. "0.0.2"). The
# release pipeline re-applies it with `helm package --version` so a release can
# never overwrite a previously published chart version.
version: 0.0.2

# This is the version number of the application being deployed. It tracks the
# published image tag from the Tekton release pipeline (for example "0.0.2").
# It is recommended to use it with quotes.
appVersion: "0.0.2"
