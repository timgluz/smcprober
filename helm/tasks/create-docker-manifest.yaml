apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-docker-manifest
  namespace: smc-cicd
spec:
  params:
    - name: image
      type: string
      description: "Image repository without a tag; the version is appended."
    - name: version
      type: string
      description: "Image tag (version) for the multi-arch manifest."
      default: latest
    - name: images
      type: array
      description: "List of arch-specific images"
    - name: additional-tag
      type: string
      description: >-
        Extra moving tag to also apply to the manifest (e.g. "latest").
        Leave empty to publish only the version tag.
      default: ""
    - name: registry-insecure
      type: string
      description: >-
        Set to "true" to skip TLS verification when pushing to the registry.
        Only use this for registries served over plain HTTP.
      default: "false"
  workspaces:
    - name: dockerconfig
  steps:
    - name: create-manifest
      image: quay.io/buildah/stable:latest
      imagePullPolicy: IfNotPresent
      args:
        - $(params.images[*])
      script: |
        #!/bin/bash
        set -e
        IMAGE="$(params.image):$(params.version)"
        ADDITIONAL_TAG="$(params.additional-tag)"

        # TLS verification is on by default; opt out only for plain-HTTP registries.
        INSECURE_FLAG=""
        if [ "$(params.registry-insecure)" = "true" ]; then
          INSECURE_FLAG="--tls-verify=false"
        fi

        echo "Creating manifest ${IMAGE}"
        buildah manifest create "${IMAGE}"

        # Add each arch-specific image to manifest
        for img in "$@" ; do
          echo "Adding ${img} to manifest"
          buildah manifest add \
            ${INSECURE_FLAG} \
            --authfile /workspace/dockerconfig/.dockerconfigjson \
            "${IMAGE}" docker://${img}
        done

        echo "Pushing manifest ${IMAGE}"
        buildah manifest push \
          ${INSECURE_FLAG} \
          --authfile /workspace/dockerconfig/.dockerconfigjson \
          --all \
          ${IMAGE} \
          docker://${IMAGE}

        # Optionally publish the same manifest under a moving tag
        if [ -n "${ADDITIONAL_TAG}" ]; then
          ADDITIONAL_IMAGE="$(params.image):${ADDITIONAL_TAG}"
          echo "Also pushing manifest as ${ADDITIONAL_IMAGE}"
          buildah manifest push \
            ${INSECURE_FLAG} \
            --authfile /workspace/dockerconfig/.dockerconfigjson \
            --all \
            ${IMAGE} \
            docker://${ADDITIONAL_IMAGE}
        fi
      securityContext:
        privileged: true
      volumeMounts:
        - name: varlibcontainers
          mountPath: /var/lib/containers
  volumes:
    - name: varlibcontainers
      emptyDir: {}
