# yaml-language-server: https://www.schemastore.org/prometheus-alertmanager.json
groups:
  - name: smartcitizen_environment_temperature_safety_alerts
    rules:
      - alert: SmartCitizenFrostWarning
        expr: smartcitizen_sensor_environment_temperature < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Device {{ $labels.device }} reports frost temperature"
          description: |-
            The temperature reported by device {{ $labels.device }} is {{ $value }}°C,
            which is below freezing. Risk of frost conditions.
      - alert: SmartCitizenExtremeCold
        expr: smartcitizen_sensor_environment_temperature < -10
        for: 15m
        labels:
          severity: critical
          notify: team_on_call
        annotations:
          summary: "Device {{ $labels.device }} reports extreme cold"
          description: |-
            The temperature reported by device {{ $labels.device }} is {{ $value }}°C,
            which is below -10°C. Extreme cold conditions — immediate attention required.
      - alert: SmartCitizenHeatWarning
        expr: smartcitizen_sensor_environment_temperature > 30
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Device {{ $labels.device }} reports heat warning temperature"
          description: |-
            The temperature reported by device {{ $labels.device }} is {{ $value }}°C,
            which exceeds the EU heat-health warning threshold of 30°C.
      - alert: SmartCitizenExtremeHeat
        expr: smartcitizen_sensor_environment_temperature > 38
        for: 15m
        labels:
          severity: critical
          notify: team_on_call
        annotations:
          summary: "Device {{ $labels.device }} reports extreme heat"
          description: |-
            The temperature reported by device {{ $labels.device }} is {{ $value }}°C,
            which exceeds the EU extreme heat threshold of 38°C. Immediate attention required.
