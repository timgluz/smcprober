# yaml-language-server: https://www.schemastore.org/prometheus-alertmanager.json
groups:
  - name: smartcitizen_environment_noise_alerts
    rules:
      - alert: SmartCitizenNoiseElevated
        expr: avg by (device) (avg_over_time(smartcitizen_sensor_environment_weighted_noise_level[1h])) > 55
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Device {{ $labels.device }} reports elevated noise level"
          description: |-
            The 1-hour average noise level reported by device {{ $labels.device }} is {{ $value }} dB(A),
            exceeding the EU Environmental Noise Directive action level of 55 dB(A).
      - alert: SmartCitizenNoiseLoud
        expr: avg by (device) (avg_over_time(smartcitizen_sensor_environment_weighted_noise_level[1h])) > 65
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Device {{ $labels.device }} reports loud sustained noise"
          description: |-
            The 1-hour average noise level reported by device {{ $labels.device }} is {{ $value }} dB(A),
            exceeding the EU Environmental Noise Directive limit value of 65 dB(A).
