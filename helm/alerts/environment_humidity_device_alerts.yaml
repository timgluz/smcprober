# yaml-language-server: https://www.schemastore.org/prometheus-alertmanager.json
groups:
  - name: smartcitizen_environment_humidity_device_alerts
    rules:
      - alert: SmartCitizenDeviceHumidityHigh
        expr: avg by (device) (smartcitizen_sensor_environment_humidity) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Device {{ $labels.device }} humidity approaching operating limit"
          description: |-
            The humidity reported by device {{ $labels.device }} is {{ $value }}%,
            approaching the maximum operating humidity of 90% RH.
      - alert: SmartCitizenDeviceHumidityCritical
        expr: avg by (device) (smartcitizen_sensor_environment_humidity) >= 90
        for: 10m
        labels:
          severity: critical
          notify: team_on_call
        annotations:
          summary: "Device {{ $labels.device }} humidity at or above operating limit"
          description: |-
            The humidity reported by device {{ $labels.device }} is {{ $value }}%,
            which has reached or exceeded the maximum operating humidity of 90% RH.
            The device may malfunction or sustain damage. Immediate action required.
