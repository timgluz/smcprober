apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: build-multiarch-image-template
  namespace: smc-cicd
spec:
  params:
    - name: repo
    - name: revision
    # Registry settings are overridable per TriggerTemplate; defaults target
    # public Docker Hub so webhook builds work without extra configuration.
    - name: image
      default: docker.io/tauho/smcprober:latest
    - name: registry
      default: docker.io
    - name: registry-insecure
      default: "false"
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: build-multiarch-image-
        namespace: smc-cicd
      spec:
        pipelineRef:
          name: build-multiarch-image
        params:
          - name: repo
            value: $(tt.params.repo)
          - name: revision
            value: $(tt.params.revision)
          - name: image
            value: $(tt.params.image)
          - name: registry
            value: $(tt.params.registry)
          - name: registry-insecure
            value: $(tt.params.registry-insecure)
        workspaces:
          - name: dockerconfig
            secret:
              secretName: docker-config
        taskRunSpecs:
          - pipelineTaskName: build-amd64
            podTemplate:
              nodeSelector:
                kubernetes.io/arch: amd64
          - pipelineTaskName: build-arm64
            podTemplate:
              nodeSelector:
                kubernetes.io/arch: arm64
