{{- if .Values.weather.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}-weather
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: weather-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: weather-exporter
  template:
    metadata:
      labels:
        {{- include "helm.labels" . | nindent 8 }}
        app.kubernetes.io/component: weather-exporter
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helm.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: weather-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/smcweather"]
          args:
            - "--config"
            - "/app/configs/configWeather.json"
            - "--dotenv"
            - "/app/secrets/env"
            - "--port"
            - "{{ .Values.weather.port }}"
          ports:
            - name: http-weather
              containerPort: {{ .Values.weather.port }}
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-weather
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-weather
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: smcprober-weather-config
              mountPath: "/app/configs"
              readOnly: true
            - name: smcprober-secret
              mountPath: "/app/secrets"
              readOnly: true
      volumes:
        - name: smcprober-secret
          secret:
            secretName: smcprober-secret
        - name: smcprober-weather-config
          configMap:
            name: smcprober-weather-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
